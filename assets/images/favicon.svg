<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Letter M Gradient -->
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Letter K Gradient -->
    <linearGradient id="kGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Center Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#2563eb" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter for Monogram -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="124" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="16"/>

  <!-- Radial Glow Behind Monogram -->
  <circle cx="256" cy="256" r="210" fill="url(#centerGlow)"/>

  <!-- Inner Subtle Accent Border -->
  <rect x="36" y="36" width="440" height="440" rx="108" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Monogram Group with Glow -->
  <g filter="url(#glowFilter)">
    <!-- Letter M -->
    <path d="M 116 356 L 116 156 L 184 262 L 252 156 L 252 356"
          fill="none"
          stroke="url(#mGrad)"
          stroke-width="42"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Letter K: Stem -->
    <path d="M 304 156 L 304 356"
          fill="none"
          stroke="url(#kGrad)"
          stroke-width="42"
          stroke-linecap="round"/>

    <!-- Letter K: Diagonal Arms -->
    <path d="M 400 156 L 308 256 L 400 356"
          fill="none"
          stroke="url(#kGrad)"
          stroke-width="42"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- Glowing Accent Tech Dot -->
  <circle cx="438" cy="354" r="14" fill="#38bdf8"/>
  <circle cx="438" cy="354" r="8" fill="#ffffff"/>
</svg>