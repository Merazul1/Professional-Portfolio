<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="sbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#sbg)" rx="12"/>
  <rect x="40" y="40" width="520" height="300" rx="10" fill="#200d05" stroke="#ea580c" stroke-width="2"/>
  <circle cx="65" cy="62" r="5" fill="#ef4444"/>
  <circle cx="82" cy="62" r="5" fill="#f59e0b"/>
  <circle cx="99" cy="62" r="5" fill="#10b981"/>
  <!-- Storefront Header -->
  <rect x="140" y="52" width="80" height="18" rx="4" fill="#ea580c"/>
  <circle cx="510" cy="62" r="14" fill="#431407" stroke="#f97316" stroke-width="1.5"/>
  <!-- Products Grid -->
  <g transform="translate(60, 95)">
    <!-- Product 1 -->
    <rect x="0" y="0" width="145" height="215" rx="8" fill="#331408" stroke="#7c2d12" stroke-width="1"/>
    <rect x="15" y="15" width="115" height="100" rx="6" fill="#431407"/>
    <circle cx="72" cy="65" r="28" fill="#ea580c" opacity="0.6"/>
    <rect x="15" y="130" width="90" height="12" rx="3" fill="#ffedd5"/>
    <rect x="15" y="150" width="50" height="14" rx="3" fill="#fdba74"/>
    <rect x="15" y="175" width="115" height="24" rx="6" fill="#ea580c"/>
    <text x="72" y="191" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Add to Bag</text>
    
    <!-- Product 2 -->
    <rect x="165" y="0" width="145" height="215" rx="8" fill="#331408" stroke="#7c2d12" stroke-width="1"/>
    <rect x="180" y="15" width="115" height="100" rx="6" fill="#431407"/>
    <rect x="200" y="45" width="75" height="40" rx="4" fill="#f97316" opacity="0.6"/>
    <rect x="180" y="130" width="95" height="12" rx="3" fill="#ffedd5"/>
    <rect x="180" y="150" width="45" height="14" rx="3" fill="#fdba74"/>
    <rect x="180" y="175" width="115" height="24" rx="6" fill="#ea580c"/>
    <text x="237" y="191" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Add to Bag</text>

    <!-- Product 3 -->
    <rect x="330" y="0" width="145" height="215" rx="8" fill="#331408" stroke="#7c2d12" stroke-width="1"/>
    <rect x="345" y="15" width="115" height="100" rx="6" fill="#431407"/>
    <polygon points="402,40 430,85 375,85" fill="#fb923c" opacity="0.7"/>
    <rect x="345" y="130" width="85" height="12" rx="3" fill="#ffedd5"/>
    <rect x="345" y="150" width="55" height="14" rx="3" fill="#fdba74"/>
    <rect x="345" y="175" width="115" height="24" rx="6" fill="#ea580c"/>
    <text x="402" y="191" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Add to Bag</text>
  </g>
</svg>
