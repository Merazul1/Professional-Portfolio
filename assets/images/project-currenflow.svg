<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="cfbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#cfbg)" rx="12"/>
  <rect x="40" y="40" width="520" height="300" rx="10" fill="#061c24" stroke="#06b6d4" stroke-width="2"/>
  <!-- Status Dots -->
  <circle cx="65" cy="62" r="5" fill="#ef4444"/>
  <circle cx="82" cy="62" r="5" fill="#f59e0b"/>
  <circle cx="99" cy="62" r="5" fill="#10b981"/>
  <rect x="130" y="52" width="180" height="20" rx="4" fill="#155e75"/>
  <text x="140" y="66" fill="#cffafe" font-family="sans-serif" font-size="10" font-weight="bold">currenflow.com</text>
  <g transform="translate(435, 52)">
    <rect width="110" height="20" rx="10" fill="#0891b2"/>
    <text x="55" y="14" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">160+ Currencies</text>
  </g>
  <!-- Main Converter Layout -->
  <g transform="translate(65, 95)">
    <rect width="470" height="225" rx="8" fill="#082833" stroke="#0e7490" stroke-width="1"/>
    <!-- Converter inputs row -->
    <g transform="translate(25, 25)">
      <!-- From input -->
      <rect width="190" height="60" rx="6" fill="#041820" stroke="#155e75"/>
      <text x="12" y="20" fill="#67e8f9" font-family="sans-serif" font-size="10">YOU SEND</text>
      <text x="12" y="44" fill="#ffffff" font-family="monospace" font-size="18" font-weight="bold">$ 1,000 USD</text>
      
      <!-- Swap circle -->
      <circle cx="210" cy="30" r="16" fill="#06b6d4"/>
      <path d="M 205 26 L 215 26 M 212 23 L 215 26 L 212 29 M 215 34 L 205 34 M 208 31 L 205 34 L 208 37" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>

      <!-- To input -->
      <g transform="translate(230, 0)">
        <rect width="190" height="60" rx="6" fill="#041820" stroke="#155e75"/>
        <text x="12" y="20" fill="#67e8f9" font-family="sans-serif" font-size="10">RECIPIENT GETS</text>
        <text x="12" y="44" fill="#34d399" font-family="monospace" font-size="18" font-weight="bold">₹ 83,850 INR</text>
      </g>
    </g>

    <!-- Quick Presets -->
    <g transform="translate(25, 100)">
      <text x="0" y="14" fill="#94a3b8" font-family="sans-serif" font-size="10">QUICK PRESETS:</text>
      <rect x="95" y="0" width="45" height="20" rx="4" fill="#0e7490"/>
      <text x="117" y="14" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">$100</text>
      <rect x="150" y="0" width="45" height="20" rx="4" fill="#0e7490"/>
      <text x="172" y="14" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">$500</text>
      <rect x="205" y="0" width="55" height="20" rx="4" fill="#06b6d4"/>
      <text x="232" y="14" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">$1,000</text>
      <rect x="270" y="0" width="55" height="20" rx="4" fill="#0e7490"/>
      <text x="297" y="14" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">$5,000</text>
    </g>

    <!-- Chart / SEO Feature Bar -->
    <g transform="translate(25, 135)">
      <rect width="420" height="70" rx="6" fill="#041820"/>
      <text x="15" y="24" fill="#67e8f9" font-family="sans-serif" font-size="10" font-weight="bold">Mid-Market Rate vs Bank Hidden Markups</text>
      <text x="15" y="44" fill="#94a3b8" font-family="sans-serif" font-size="9">1 USD = 83.8500 INR • Updated live via financial telemetry</text>
      <rect x="300" y="18" width="105" height="34" rx="6" fill="#0284c7"/>
      <text x="352" y="39" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Copy &amp; Embed</text>
    </g>
