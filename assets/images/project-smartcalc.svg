<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="scbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="scglow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#scbg)" rx="12"/>
  <rect x="40" y="40" width="520" height="300" rx="10" fill="#090d16" stroke="#2563eb" stroke-width="2"/>
  <!-- Status Dots -->
  <circle cx="65" cy="62" r="5" fill="#ef4444"/>
  <circle cx="82" cy="62" r="5" fill="#f59e0b"/>
  <circle cx="99" cy="62" r="5" fill="#10b981"/>
  <rect x="130" y="52" width="180" height="20" rx="4" fill="#1e293b"/>
  <text x="140" y="66" fill="#93c5fd" font-family="sans-serif" font-size="10" font-weight="bold">smartcalclab.com</text>
  <!-- Top Badges -->
  <g transform="translate(360, 52)">
    <rect width="85" height="20" rx="10" fill="#065f46"/>
    <text x="42" y="14" fill="#a7f3d0" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">100/100 SEO</text>
  </g>
  <g transform="translate(455, 52)">
    <rect width="90" height="20" rx="10" fill="#1e3a8a"/>
    <text x="45" y="14" fill="#bfdbfe" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">7 Languages</text>
  </g>
  <!-- Main Calculator Display Area -->
  <g transform="translate(65, 95)">
    <!-- Display Screen -->
    <rect width="470" height="60" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="20" y="26" fill="#94a3b8" font-family="sans-serif" font-size="11">Net Salary Paycheck (US / UK / CA / IN)</text>
    <text x="450" y="45" fill="#38bdf8" font-family="monospace" font-size="24" font-weight="bold" text-anchor="end">$8,450.00 / mo</text>
    <!-- Keypad Grid Preview -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="105" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="52" y="26" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Mortgage</text>
      
      <rect x="120" y="0" width="105" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="172" y="26" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Auto Loan</text>

      <rect x="240" y="0" width="105" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="292" y="26" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Compound</text>

      <rect x="360" y="0" width="110" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="415" y="26" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">BMI &amp; Health</text>
    </g>
    <!-- Graph Preview -->
    <g transform="translate(0, 130)">
      <rect width="470" height="75" rx="6" fill="#0a1220" stroke="#1e293b"/>
      <path d="M 20 60 Q 120 50 220 30 T 450 15" fill="none" stroke="url(#scglow)" stroke-width="3"/>
      <circle cx="450" cy="15" r="4" fill="#10b981"/>
      <text x="20" y="25" fill="#64748b" font-family="sans-serif" font-size="10">30-Year Amortization Schedule Forecast</text>
    </g>
  </g>
</svg>
