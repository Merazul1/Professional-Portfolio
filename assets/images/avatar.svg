<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8d7b8" />
      <stop offset="100%" stop-color="#e2ab82" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" />

  <!-- Subtle Tech Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="320" x2="400" y2="320" />
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
  </g>

  <!-- Glowing Accent Halo -->
  <circle cx="200" cy="180" r="110" fill="none" stroke="url(#primaryGlow)" stroke-width="3" stroke-dasharray="10 6" filter="url(#glowEffect)" opacity="0.8" />

  <!-- Shoulders & Torso -->
  <path d="M 110 380 Q 110 290 200 290 Q 290 290 290 380 Z" fill="#1e293b" stroke="#334155" stroke-width="3" />
  <!-- Modern Hoodie / Collar -->
  <path d="M 160 290 L 200 340 L 240 290 Z" fill="#0f172a" />
  <path d="M 180 290 L 200 320 L 220 290 Z" fill="#38bdf8" opacity="0.6" />

  <!-- Neck -->
  <rect x="180" y="240" width="40" height="60" rx="8" fill="url(#skinGrad)" />

  <!-- Head -->
  <ellipse cx="200" cy="190" rx="55" ry="65" fill="url(#skinGrad)" />

  <!-- Modern Hair -->
  <path d="M 140 180 Q 140 120 200 120 Q 260 120 260 180 Q 240 140 200 140 Q 160 140 140 180 Z" fill="#18181b" />
  <!-- Hair top texture -->
  <path d="M 150 145 C 170 125, 230 125, 250 145 C 240 130, 210 120, 195 120 C 175 120, 155 135, 150 145 Z" fill="#27272a" />

  <!-- Stylish Glasses -->
  <rect x="155" y="175" width="38" height="28" rx="7" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="2.5" />
  <rect x="207" y="175" width="38" height="28" rx="7" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="2.5" />
  <line x1="193" y1="188" x2="207" y2="188" stroke="#38bdf8" stroke-width="2.5" />
  <line x1="145" y1="186" x2="155" y2="186" stroke="#38bdf8" stroke-width="2.5" />
  <line x1="245" y1="186" x2="255" y2="186" stroke="#38bdf8" stroke-width="2.5" />

  <!-- Confident Smile -->
  <path d="M 185 224 Q 200 236 215 224" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" />

  <!-- Tech Floating Badges -->
  <g transform="translate(60, 100)">
    <rect width="64" height="28" rx="14" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
    <text x="32" y="18" fill="#e0e7ff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">&lt;dev/&gt;</text>
  </g>
  <g transform="translate(280, 240)">
    <rect width="68" height="28" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <circle cx="16" cy="14" r="4" fill="#10b981" />
    <text x="42" y="18" fill="#a7f3d0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ONLINE</text>
  </g>
</svg>
