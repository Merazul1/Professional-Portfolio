<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="pbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="chartGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#pbg)" rx="12"/>
  <rect x="40" y="40" width="520" height="300" rx="10" fill="#061f1b" stroke="#047857" stroke-width="2"/>
  <!-- Status Bar -->
  <circle cx="65" cy="62" r="5" fill="#ef4444"/>
  <circle cx="82" cy="62" r="5" fill="#f59e0b"/>
  <circle cx="99" cy="62" r="5" fill="#10b981"/>
  <!-- Top Stat Cards -->
  <g transform="translate(60, 85)">
    <rect width="145" height="60" rx="6" fill="#042f2e" stroke="#115e59" stroke-width="1"/>
    <text x="15" y="25" fill="#99f6e4" font-family="sans-serif" font-size="10">Active Telemetry</text>
    <text x="15" y="48" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">99.98%</text>
  </g>
  <g transform="translate(225, 85)">
    <rect width="145" height="60" rx="6" fill="#042f2e" stroke="#115e59" stroke-width="1"/>
    <text x="15" y="25" fill="#99f6e4" font-family="sans-serif" font-size="10">Avg Latency</text>
    <text x="15" y="48" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">28 ms</text>
  </g>
  <g transform="translate(390, 85)">
    <rect width="145" height="60" rx="6" fill="#042f2e" stroke="#115e59" stroke-width="1"/>
    <text x="15" y="25" fill="#99f6e4" font-family="sans-serif" font-size="10">Requests / sec</text>
    <text x="15" y="48" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">14.2k</text>
  </g>
  <!-- Chart area -->
  <g transform="translate(60, 160)">
    <rect width="475" height="160" rx="8" fill="#022c22" stroke="#0f766e" stroke-width="1"/>
    <!-- Grid -->
    <line x1="20" y1="40" x2="455" y2="40" stroke="#134e4a" stroke-dasharray="4"/>
    <line x1="20" y1="80" x2="455" y2="80" stroke="#134e4a" stroke-dasharray="4"/>
    <line x1="20" y1="120" x2="455" y2="120" stroke="#134e4a" stroke-dasharray="4"/>
    <!-- Graph -->
    <path d="M 20 120 Q 80 130 140 80 T 260 90 T 360 40 T 455 60 L 455 150 L 20 150 Z" fill="url(#chartGlow)"/>
    <path d="M 20 120 Q 80 130 140 80 T 260 90 T 360 40 T 455 60" fill="none" stroke="#10b981" stroke-width="3"/>
    <circle cx="360" cy="40" r="5" fill="#34d399"/>
  </g>
</svg>
