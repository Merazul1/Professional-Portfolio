<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="mlmbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#mlmbg)" rx="12"/>
  <rect x="40" y="40" width="520" height="300" rx="10" fill="#0c0a21" stroke="#6366f1" stroke-width="2"/>
  <circle cx="65" cy="62" r="5" fill="#ef4444"/>
  <circle cx="82" cy="62" r="5" fill="#f59e0b"/>
  <circle cx="99" cy="62" r="5" fill="#10b981"/>
  <rect x="130" y="52" width="220" height="20" rx="4" fill="#312e81"/>
  <text x="140" y="66" fill="#e0e7ff" font-family="sans-serif" font-size="10" font-weight="bold">MLM Enterprise &amp; Genealogy Engine</text>
  <!-- Genealogy Tree Visualization -->
  <g transform="translate(65, 95)">
    <rect width="470" height="225" rx="8" fill="#141138" stroke="#4338ca" stroke-width="1"/>
    <text x="20" y="24" fill="#a5b4fc" font-family="sans-serif" font-size="11" font-weight="bold">Interactive Binary Genealogy Tree &amp; E-Wallet</text>
    
    <!-- Root node -->
    <circle cx="235" cy="55" r="18" fill="#4f46e5" stroke="#818cf8" stroke-width="2"/>
    <text x="235" y="59" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">ROOT</text>

    <!-- Branch lines -->
    <line x1="220" y1="68" x2="140" y2="105" stroke="#6366f1" stroke-width="2"/>
    <line x1="250" y1="68" x2="330" y2="105" stroke="#6366f1" stroke-width="2"/>

    <!-- Left Child -->
    <circle cx="140" cy="115" r="16" fill="#059669" stroke="#34d399" stroke-width="2"/>
    <text x="140" y="119" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Left</text>
    
    <!-- Right Child -->
    <circle cx="330" cy="115" r="16" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="330" y="119" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Right</text>

    <!-- Stats strip -->
    <g transform="translate(20, 160)">
      <rect width="135" height="50" rx="6" fill="#0c0a21"/>
      <text x="12" y="20" fill="#94a3b8" font-family="sans-serif" font-size="9">E-Wallet Balance</text>
      <text x="12" y="38" fill="#34d399" font-family="monospace" font-size="14" font-weight="bold">₹ 4,82,500</text>

      <rect x="145" y="0" width="135" height="50" rx="6" fill="#0c0a21"/>
      <text x="157" y="20" fill="#94a3b8" font-family="sans-serif" font-size="9">Commission Calculated</text>
      <text x="157" y="38" fill="#60a5fa" font-family="monospace" font-size="14" font-weight="bold">Active Payout</text>

      <rect x="290" y="0" width="140" height="50" rx="6" fill="#0c0a21"/>
      <text x="302" y="20" fill="#94a3b8" font-family="sans-serif" font-size="9">Downline Network</text>
      <text x="302" y="38" fill="#facc15" font-family="monospace" font-size="14" font-weight="bold">12,450 Users</text>
    </g>
  </g>
</svg>
