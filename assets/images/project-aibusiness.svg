<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="aibg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#aibg)" rx="12"/>
  <rect x="40" y="40" width="520" height="300" rx="10" fill="#130924" stroke="#7c3aed" stroke-width="2"/>
  <!-- Status Dots -->
  <circle cx="65" cy="62" r="5" fill="#ef4444"/>
  <circle cx="82" cy="62" r="5" fill="#f59e0b"/>
  <circle cx="99" cy="62" r="5" fill="#10b981"/>
  <rect x="130" y="52" width="220" height="20" rx="4" fill="#2e1065"/>
  <text x="140" y="66" fill="#ddd6fe" font-family="sans-serif" font-size="10" font-weight="bold">AI Business Automation SaaS</text>
  <!-- Main Grid -->
  <!-- Left: CRM & Leads -->
  <g transform="translate(65, 95)">
    <rect width="260" height="225" rx="8" fill="#1e1138" stroke="#4c1d95" stroke-width="1"/>
    <text x="15" y="24" fill="#c4b5fd" font-family="sans-serif" font-size="11" font-weight="bold">CRM &amp; Auto-Scored Leads</text>
    
    <g transform="translate(15, 38)">
      <rect width="230" height="50" rx="6" fill="#2e1065" stroke="#8b5cf6" stroke-width="1"/>
      <circle cx="20" cy="25" r="10" fill="#10b981"/>
      <text x="38" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Jordan Lee (High Intent)</text>
      <text x="38" y="38" fill="#a78bfa" font-family="sans-serif" font-size="9">Lead Score: 96/100 • $3,500 Quote</text>
    </g>

    <g transform="translate(15, 96)">
      <rect width="230" height="50" rx="6" fill="#0f091c"/>
      <circle cx="20" cy="25" r="10" fill="#3b82f6"/>
      <text x="38" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">TechCorp Inbound Ticket</text>
      <text x="38" y="38" fill="#94a3b8" font-family="sans-serif" font-size="9">Auto-Triage: SALES_LEAD</text>
    </g>

    <g transform="translate(15, 154)">
      <rect width="230" height="50" rx="6" fill="#0f091c"/>
      <circle cx="20" cy="25" r="10" fill="#f59e0b"/>
      <text x="38" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Invoice #INV-2026-081</text>
      <text x="38" y="38" fill="#94a3b8" font-family="sans-serif" font-size="9">Generated PDFKit • $1,250 Paid</text>
    </g>
  </g>
  <!-- Right: Live AI Chat Widget -->
  <g transform="translate(340, 95)">
    <rect width="195" height="225" rx="8" fill="#1e1138" stroke="#7c3aed" stroke-width="1.5"/>
    <rect width="195" height="35" rx="8" fill="#7c3aed"/>
    <text x="15" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">AI Agent Simulator</text>
    <circle cx="175" cy="18" r="4" fill="#10b981"/>
    
    <!-- Chat bubbles -->
    <g transform="translate(12, 48)">
      <rect width="150" height="36" rx="6" fill="#2e1065"/>
      <text x="8" y="15" fill="#ddd6fe" font-family="sans-serif" font-size="9">Hi! How can I help your</text>
      <text x="8" y="28" fill="#ddd6fe" font-family="sans-serif" font-size="9">business scale today?</text>
    </g>

    <g transform="translate(30, 92)">
      <rect width="150" height="36" rx="6" fill="#6d28d9"/>
      <text x="8" y="15" fill="#ffffff" font-family="sans-serif" font-size="9">I need an automated bot</text>
      <text x="8" y="28" fill="#ffffff" font-family="sans-serif" font-size="9">for customer appointments.</text>
    </g>

    <g transform="translate(12, 136)">
      <rect width="168" height="40" rx="6" fill="#2e1065"/>
      <text x="8" y="15" fill="#ddd6fe" font-family="sans-serif" font-size="9">Perfect! We can deploy that</text>
      <text x="8" y="28" fill="#a78bfa" font-family="sans-serif" font-size="8">in 24 hours. What's your email?</text>
    </g>
    
    <rect x="12" y="185" width="170" height="26" rx="6" fill="#0f091c" stroke="#4c1d95"/>
    <text x="20" y="202" fill="#6b7280" font-family="sans-serif" font-size="9">Type a message...</text>
  </g>
